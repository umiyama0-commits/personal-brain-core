<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pbmTitle pbmDesc" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<title id="pbmTitle">Personal Brain 全体マップ</title>
<desc id="pbmDesc">社長の人格(判断軸・価値観・口調)と会社の事実(売上・店舗・エリア・組織・戦略)が中心の Personal Brain を介して結びつき、検索・生成エンジンと品質ループ・プライバシー関所を通じて社員に応答する知識マップ。</desc>

<text x="110" y="44" font-size="12.5" fill="#9aa6b0">── 社長の人格 ──</text>
<text x="612" y="44" font-size="12.5" fill="#9aa6b0">── 会社の事実 ──</text>

