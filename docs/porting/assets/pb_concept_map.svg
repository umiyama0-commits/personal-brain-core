<line x1="380" y1="360" x2="520" y2="410"/>
</g>

<path d="M95,120 Q340,18 560,85" stroke="#d8a24a" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
<text x="335" y="48" text-anchor="middle" font-size="11.5" fill="#b3772a">判断軸 ↔ 戦略 がつながる</text>

<rect x="296" y="197" width="168" height="56" rx="11" fill="#2a4d69"/>
