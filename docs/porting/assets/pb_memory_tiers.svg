<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memTitle memDesc" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<title id="memTitle">記憶の階層(DBの階層化)</title>
<desc id="memDesc">人間の記憶に倣った3階層。常時記憶(CORE)は人格と最重要事実を毎回参照。検索で引く倉庫は1,000以上の資料から関係する数件だけ取り出す。個人別メモリーは相手ごとに前回の話や好みを記憶する。</desc>

<defs>
<marker id="memArrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
<path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9aa6b0" stroke-width="1.6"/>
</marker>
</defs>

<line x1="92" y1="60" x2="92" y2="352" stroke="#9aa6b0" stroke-width="2" marker-end="url(#memArrow)"/>
<text x="92" y="48" text-anchor="middle" font-size="12" fill="#7a8690">常に頭にある</text>
<text x="92" y="372" text-anchor="middle" font-size="12" fill="#7a8690">必要な時だけ引く</text>

<rect x="250" y="55" width="320" height="78" rx="12" fill="#2a4d69"/>
<text x="410" y="88" text-anchor="middle" font-size="15.5" fill="#ffffff" font-weight="500">① 常時記憶(CORE)</text>
<text x="410" y="111" text-anchor="middle" font-size="12.5" fill="#cdd9e5">人格・最重要の事実を、毎回かならず参照</text>

<rect x="160" y="158" width="500" height="94" rx="12" fill="#e9f4ee" stroke="#2f8f63" stroke-width="1.5"/>
<text x="410" y="187" text-anchor="middle" font-size="15.5" fill="#1f6b4a" font-weight="500">② 検索で引く倉庫</text>
<text x="410" y="211" text-anchor="middle" font-size="12.5" fill="#2f6b4f">1,000 以上の資料から、質問に関係する数件だけ取り出す</text>
<text x="410" y="233" text-anchor="middle" font-size="11.5" fill="#4a7c63">(意味で探す + 言葉で探す + 関係順に再ランク)</text>

<rect x="160" y="277" width="500" height="84" rx="12" fill="#f1efe8" stroke="#8a8780" stroke-width="1.5"/>
<text x="410" y="307" text-anchor="middle" font-size="15.5" fill="#44423c" font-weight="500">③ 個人別メモリー</text>
<text x="410" y="331" text-anchor="middle" font-size="12.5" fill="#5f5e5a">相手ごとに「前回の話・好み」を覚えて、会話を続ける</text>

<text x="688" y="205" text-anchor="middle" font-size="11" fill="#8a98a6">大量</text>
<text x="688" y="92" text-anchor="middle" font-size="11" fill="#8a98a6">少量</text>
</svg>
