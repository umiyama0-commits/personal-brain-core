# gitleaks rules — brain-agent 専用補強
# ★2026-05-25 BLOCKER 後対応: 過去 leak した token / API key パターンの再発防止
title = "brain-agent gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "cohere-api-key"
description = "Cohere API key (Cohere AI rerank/etc.)"
regex = '''cohere_[A-Za-z0-9]{30,}'''
secretGroup = 0
keywords = ["cohere_"]

[[rules]]
id = "alignment-trial-token-hardcode"
description = "ALIGNMENT_TRIAL_TOKEN を hardcode default にしてはいけない (.env 経由のみ)"
regex = '''ALIGNMENT_TRIAL_TOKEN\s*=\s*["'][A-Za-z0-9_\-]{20,}["']'''
keywords = ["ALIGNMENT_TRIAL_TOKEN"]

[[rules]]
id = "voice-align-token-hardcode"
description = "VOICE_ALIGN_TOKEN を hardcode default にしてはいけない"
regex = '''VOICE_ALIGN_TOKEN\s*=\s*["'][A-Za-z0-9_\-]{20,}["']'''
keywords = ["VOICE_ALIGN_TOKEN"]

[[rules]]
id = "elevenlabs-api-key"
description = "ElevenLabs API key (sk_ prefix, 48 hex)"
regex = '''sk_[0-9a-f]{48,}'''
keywords = ["sk_"]

[[rules]]
id = "vapi-pk-uuid"
description = "Vapi Public Key (UUID format)"
regex = '''VAPI_PUBLIC_KEY\s*=\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}["']?'''
keywords = ["VAPI_PUBLIC_KEY"]

[[rules]]
id = "litellm-master-key"
description = "LiteLLM master key (sk-litellm- prefix) を hardcode してはいけない (.env 経由のみ)"
regex = '''sk-litellm-[A-Za-z0-9_\-]{6,}'''
keywords = ["sk-litellm-"]

[[rules]]
id = "owndays-mobile-password"
description = "OWNDAYS Net Mobile password (Owndays + 数字) を hardcode してはいけない (.env 経由のみ)"
regex = '''Owndays[0-9]{3,}'''
keywords = ["Owndays"]

[[rules]]
id = "stapa-login-hardcode"
description = "STAPA scraper の LOGIN_PASS を hardcode してはいけない (.env 経由のみ)"
regex = '''LOGIN_PASS\s*=\s*["'][^"']{6,}["']'''
keywords = ["LOGIN_PASS"]

[[rules]]
id = "lineworks-login-pw-hardcode"
description = "LINE Works scraper の --login-pw を平文 hardcode してはいけない (.env 経由のみ、★2026-06-08 評価 0-1: 旧 LW パスワードが既存 rule を素通りした gap 修正)"
# CLI 引数 `--login-pw "値"` (空白 + クォート + 非 $ 文字始まり) を検出。
# `--login-pw "$VAR"` (env 参照) と argparse 定義 `"--login-pw"` は除外。
regex = '''--login-pw\s+["'][^"'$][^"']*["']'''
keywords = ["login-pw"]

[[rules]]
id = "masked-credential-fragment"
description = "資格情報の **部分マスク** を書かない (★2026-08-18 実害: 作業メモの部分マスクが公開 repo に1ヶ月出た)。伏せたつもりでも長さ・先頭末尾・生成の癖が残り、gitleaks の『本物の秘密』検出は素通りする。値は1文字も書かず、env 変数名だけで指すこと。"
regex = '''[A-Za-z0-9]{1,4}[*＊]{2,}[A-Za-z0-9]{1,4}'''
keywords = ["*"]

[[rules]]
id = "password-label-with-value"
description = "パスワードをラベル付きで平文表記しない (docs/コメント/コミットメッセージ含む)"
# ★gitleaks は Go の RE2 = 否定先読み (?!) を使えない。placeholder の除外は
#   下の [rules.allowlist] で行う (inline lookahead にすると config が panic する)。
regex = '''(?i)(パスワード|password|passwd|pwd|暗証番号)\s*(は|:|：|=|＝)\s*[^\s。、,」）)]{4,}'''
keywords = ["パスワード", "password", "passwd", "pwd", "暗証番号"]

[rules.allowlist]
description = "placeholder / env 参照 / URL は値ではない"
regexes = [
    '''(?i)(パスワード|password|passwd|pwd|暗証番号)\s*(は|:|：|=|＝)\s*(https?://|<|\$|\{|your-|xxx|\.\.\.|os\.getenv|変[えわ])''',
    '''(?i)password["\047]?\s*[:=]\s*["\047]?(os\.environ|process\.env)''',
]

[allowlist]
# ★2026-08-18: 旧版は paths に ^docs/.*\.md$ があり **docs 配下を丸ごと除外**していた。
# そのため作業メモの部分マスクが検出されず公開 repo へ出た。
# placeholder の許容は下の regexes だけで足り、path 単位の全除外は穴になるので撤去した。
description = "test fixtures + 例示 placeholder は許容 (.env.example の your-password / your-key-here 等)"
paths = [
    '''^\.env\.example$''',
    # ★検出ルール自身のテスト。パターンを含まないと検出を検証できない。
    # docs 全除外のような広い穴にしないため **この 1 ファイルに限定** する。
    '''^tests/test_privacy_gate_injection\.py$''',
]
regexes = [
    '''cohere_<[A-Z_]+>''',           # cohere_<REDACTED_*> placeholder
    '''cohere_AyzAAK0Gl7\.{3}''',     # 過去 leak token の sanitize 痕跡
    '''sk_[a-z]{4}\.{3}''',           # sk_xxxx... display 例
    '''your-password''',              # .env.example の OWNDAYS/STAPA placeholder
    '''sk-litellm-your-key-here''',   # .env.example の LiteLLM placeholder
]
